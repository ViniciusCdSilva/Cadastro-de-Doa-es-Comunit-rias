<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Doações</title>
   <link rel="stylesheet" href="index.css">
</head>
<body>    
  <div>
    <H2 class="avisos">
      Avisos da ONG
    </H2>
  </div>
  <form id="formDoacao">
    <h2 id="titulo">Cadastro de Doações Comunitárias</h2>
    <label>Nome:</label>
    <input type="text" id="nome" required><br><br>

    <label>Item:</label>
    <input type="text" id="item" required><br><br>

    <label>Quantidade:</label>
    <input type="number" id="quantidade" required><br><br>

    <label>Contato:</label>
    <input type="text" id="contato" required><br><br>

    <button type="submit">Cadastrar</button>
  </form>

  <form id="formpedido">
    <h2 id="titulo">Cadastro de Pedidos Comunitários</h2>
    <label>Nome:</label>
    <input type="text" id="nomePedido" required><br><br>

    <label>Item:</label>
    <input type="text" id="itemPedido" required><br><br>

    <label>Quantidade:</label>
    <input type="number" id="quantidadePedido" required><br><br>

    <label>Contato:</label>
    <input type="text" id="contatoPedido" required><br><br>

    <button type="submit">Cadastrar Pedido</button>
  </form>

  <div id="mensagem"></div>
</body>
</html>
